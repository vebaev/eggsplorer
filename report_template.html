<style>
/* Layout: lab-notebook report — sticky section bar, one reading column of panels,
   a two-column evidence view for metabolic functions. Pastel data colours on a
   white page; deliberately light-only so it prints and embeds like a lab report.
   Metabolic completeness uses one green ramp only. */
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f3f6f5; --ink: #1d2a2c; --muted: #5a6a6c;
  --line: #dfe6e4; --accent: #2f7380; --accent-soft: #dcf0f2; --warn: #b5651d; --warn-soft: #fbead6;
  --s1: #dcefd4; --s2: #cbe9c1; --s3: #a6d99e; --s4: #7fc483; --s-ink: #1b3320;
  --p1: #a8d8ea; --p2: #f6c6c7; --p3: #c9e4c5; --p4: #ffe3a3; --p5: #d5c6e0; --p6: #b8e0d2; --p7: #f7d6bf; --p8: #c6d8f0;
  --g-info: #a9cbe9; --g-cell: #c3e3bd; --g-metab: #f6d2a6; --g-poor: #d8d1e8;
  --f-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif; /* Plex Sans covers Cyrillic */
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .tile:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; }
h2 { font-size: 1.45rem; line-height: 1.2; }
h3 { font-size: 1.05rem; line-height: 1.3; }
p { margin: 0; max-width: 72ch; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 28px 22px; display: grid; gap: 14px; }
h1.brand { color: #7fc483; text-transform: uppercase; letter-spacing: 0.06em; }
.sample { font-size: 1.15rem; color: var(--muted); overflow-wrap: anywhere; }
.sample b { color: var(--ink); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 0.9rem; }
.meta span { overflow-wrap: anywhere; min-width: 0; }
.meta b { color: var(--ink); font-weight: 500; }
nav.sections { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.sections .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-block: 6px; }
nav.sections a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; }
nav.sections a:hover { color: var(--ink); background: var(--surface-2); }

main .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 26px 40px; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; scroll-margin-top: 64px; }
section > *, .grid-2 > *, .func-layout > *, .groups > *, .cog-layout > * { min-width: 0; }
.section-head { display: grid; gap: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.kpi { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-display); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .l { color: var(--muted); font-size: 0.85rem; }
.kpi .s { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.chart { width: 100%; min-height: 220px; }
.note { color: var(--muted); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); flex: none; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; color: var(--muted); cursor: pointer; max-width: 100%; min-width: 0; }
input[type="search"], select { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type="search"] { flex: 1 1 260px; min-width: 0; }
select { max-width: 100%; min-width: 0; text-overflow: ellipsis; }

/* segmented switch */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 0.88rem; border: 0; background: var(--surface); color: var(--muted); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }

/* COG */
#tbl-genes td.desc { min-width: 300px; }
#tbl-genes td.list { white-space: normal; max-width: 170px; }
#tbl-genes td.list span { white-space: nowrap; }
#tbl-genes td.id { white-space: nowrap; }
td .letter { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-weight: 500; }

/* functions */
.func-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 14px; align-items: start; }
@media (max-width: 900px) { .func-layout { grid-template-columns: minmax(0, 1fr); } }
.fmatrix { display: grid; padding-block: 4px; }
.frow { display: grid; grid-template-columns: minmax(140px, 200px) minmax(0, 1fr); gap: 4px 12px; padding-block: 7px; border-bottom: 1px solid var(--line); align-items: start; }
.frow:last-child { border-bottom: 0; }
.frow .cat { font-size: 0.84rem; font-weight: 500; line-height: 1.3; padding-top: 3px; }
.frow .cat .muted { display: block; font-family: var(--f-mono); font-size: 0.72rem; font-weight: 400; }
@media (max-width: 600px) { .frow { grid-template-columns: minmax(0, 1fr); } }
.chips2 { display: flex; flex-wrap: wrap; gap: 4px; }
.tile span { overflow-wrap: anywhere; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; border-radius: 6px; padding: 3px 8px;
  display: inline-flex; align-items: baseline; gap: 6px; color: var(--s-ink); font-size: 0.78rem; line-height: 1.3;
  border: 1px solid transparent; position: relative; max-width: 100%; }
.tile .v { font-family: var(--f-mono); font-size: 0.72rem; opacity: 0.8; }
.tile[data-bin="1"] { background: var(--s1); } .tile[data-bin="2"] { background: var(--s2); }
.tile[data-bin="3"] { background: var(--s3); } .tile[data-bin="4"] { background: var(--s4); }
.tile:hover { border-color: var(--s-ink); }
.tile[aria-pressed="true"] { border-color: var(--s-ink); box-shadow: 0 0 0 1px var(--s-ink) inset; }
.tile .flag { position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.scale { display: flex; gap: 4px; align-items: center; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
.scale span.box { width: 26px; height: 12px; border-radius: 3px; display: inline-block; }
aside.evidence { position: sticky; top: 64px; display: grid; gap: 12px; max-height: calc(100vh - 90px); overflow: auto; }
.ev-score { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 0.85rem; }
.ev-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ev-list li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 0.86rem; align-items: baseline; }
.ev-list .genes { grid-column: 2; color: var(--muted); font-family: var(--f-mono); font-size: 0.78rem; overflow-wrap: anywhere; }
.pill { font-family: var(--f-mono); font-size: 0.72rem; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.callout { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; }
.kolist { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--f-mono); font-size: 0.8rem; }
details summary { cursor: pointer; color: var(--muted); font-size: 0.88rem; }

/* tables */
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.mono { white-space: nowrap; }
tbody tr:hover td { background: var(--surface-2); }
.derived { color: var(--muted); }
.pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; font-size: 0.88rem; color: var(--muted); flex-wrap: wrap; }
.pager button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 5px 12px; cursor: pointer; }
.pager button:disabled { opacity: 0.45; cursor: default; }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { padding-block: 20px 28px; display: grid; gap: 8px; color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* element cycles (SVG) */
.cy-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.85rem; color: var(--muted); align-items: center; }
.cy-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cy-sw { width: 28px; height: 0; border-top: 4px solid; display: inline-block; }
.cy-caveat { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.88rem; color: #5b3a12; }
.cy svg { display: block; width: 100%; height: auto; font-family: var(--f-body); }
.cy-e { fill: none; stroke-linecap: round; }
.cy-e-full { stroke: #3f9a50; stroke-width: 4.5; } .cy-e-mid { stroke: var(--s4); stroke-width: 3.5; } .cy-e-low { stroke: var(--s3); stroke-width: 3; }
.cy-e-abs, .cy-e-na { stroke: #c3ccc9; stroke-width: 1.6; stroke-dasharray: 5 4; }
.cy-m-full { fill: #3f9a50; } .cy-m-mid { fill: var(--s4); } .cy-m-low { fill: var(--s3); } .cy-m-abs, .cy-m-na { fill: #c3ccc9; }
.cy-node circle, .cy-node rect { fill: #fff; stroke: var(--ink); stroke-width: 1.4; }
.cy-node text { font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.cy-lab rect { fill: #fff; opacity: 0.93; }
.cy-lab .t1 { font-size: 11px; font-weight: 500; fill: var(--ink); }
.cy-lab .t2 { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.cy-lab.off .t1 { fill: var(--muted); font-weight: 400; }

/* cell overview (SVG) */
.ce-wrap { overflow-x: auto; }
.ce-wrap svg { display: block; width: 100%; min-width: 820px; height: auto; font-family: var(--f-body); }
.ce-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.85rem; color: var(--muted); }
.ce-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ce-sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,0.12); }
.ce-nf { display: grid; gap: 6px; }
.ce-nfrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 0.85rem; }
.ce-nfrow b { font-weight: 500; margin-right: 4px; }
.ce-chip { background: var(--surface-2); border-radius: 999px; padding: 1px 9px; font-size: 0.8rem; color: var(--muted); }
.ce-membrane { fill: none; stroke: #e3ebe8; stroke-width: 16; }
.ce-mline { fill: none; stroke: #c4d0cc; stroke-width: 1; }
.ce-wall { fill: none; stroke: #efe6d2; }
.ce-wall-line { fill: none; stroke: #d8c9a6; stroke-width: 1; stroke-dasharray: 3 3; }
.ce-peri { fill: #f7faf9; }
.ce-cyto { fill: #fbfdfc; }
.ce-full { fill: var(--s4); } .ce-mid { fill: var(--s3); } .ce-low { fill: var(--s2); }
.ce-slot { stroke: rgba(29,42,44,0.35); stroke-width: 1; }
.ce-tr { fill: var(--p8); }
.ce-lbl { font-size: 11.5px; fill: var(--ink); }
.ce-lbl .sc { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.ce-zone { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; fill: var(--muted); text-transform: uppercase; }
.ce-tile text { fill: var(--s-ink); }
.ce-tile .t1 { font-size: 11.5px; font-weight: 600; }
.ce-tile .t2 { font-family: var(--f-mono); font-size: 10px; }
.ce-flag { fill: none; stroke: var(--s-ink); stroke-width: 1.6; }
</style>

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("report-data").textContent);
  var D = P.d, T = P.t;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var loc = T.lang === "bg" ? "bg-BG" : "en-GB";
  var fmt = function (n) { return Number(n).toLocaleString(loc); };
  var pct = function (a, b) { return b ? (100 * a / b).toLocaleString(loc, { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + "%" : "—"; };
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
  var PASTEL = function () { return ["--p1","--p2","--p3","--p4","--p5","--p6","--p7","--p8"].map(css); };

      { from: "SO3", to: "H2S", name: ["assimilatory reduction", "асимилационна редукция"], genes: "cysJI / sir", score: S("sulfur assimilation"), side: "in", bend: 26, lo: [30, 2] },
      { from: "H2S", to: "S0", name: ["sulfide oxidation", "окисление на сулфид"], genes: "sqr / fccB", score: S("sulfide oxidation"), side: "out", bend: 30, lo: [14, 8] },
      { from: "S0", to: "H2S", name: ["S⁰ reduction", "редукция на S⁰"], genes: "sreABC / hydABGD", score: best(["sulfur reductase sreABC", "sulfhydrogenase"]), side: "in", bend: 24, lo: [-22, -42] },
      { from: "S0", to: "SO3", name: ["S⁰ dioxygenase", "S⁰ диоксигеназа"], genes: "sdo", score: S("sulfur dioxygenase"), side: "in", bend: 70, lo: [0, -6] },
      { from: "SO3", to: "SO4", name: ["sulfite oxidation", "окисление на сулфит"], genes: "sorA / soeABC", score: best(["sulfite dehydrogenase", "sulfite dehydrogenase (quinone)"]), side: "in", bend: 36, lo: [14, 0] },
      { from: "S2O3", to: "SO4", name: ["thiosulfate oxidation", "окисление на тиосулфат"], genes: "soxABXYZ", score: S("thiosulfate oxidation"), side: "out", bend: 30, lo: [-6, 22] },
      { from: "S2O3", to: "S4O6", name: ["to tetrathionate", "до тетратионат"], genes: "tsdA / doxDA", score: best(["alt thiosulfate oxidation tsdA", "alt thiosulfate oxidation doxAD"]), bend: 0, lo: [-50, -50] },
      { from: "S2O3", to: "H2S", name: ["thiosulfate reduction", "редукция на тиосулфат"], genes: "phsABC", score: S("thiosulfate/polysulfide reductase"), side: "in", bend: 30, lo: [26, -30] }

      "NAD-reducing hydrogenase", "NADP-reducing hydrogenase", "NiFe hydrogenase Hyd-1"];

      { from: "CO2", to: "BIO", name: ["3-HP bicycle", "3-HP двоен цикъл"], genes: "", score: S("3-Hydroxypropionate Bicycle"), bend: -64, oneLine: true },
      { from: "CO2", to: "BIO", name: ["3-HP / 4-HB", "3-HP / 4-HB"], genes: "", score: S("4-Hydroxybutyrate/3-hydroxypropionate"), bend: -128, oneLine: true },
      { from: "CO2", to: "CH4", name: ["methanogenesis", "метаногенеза"], genes: "", score: best(methano), bend: 0, lo: [0, 4] },
      { from: "CH4", to: "CH3OH", name: ["CH₄ oxidation", "окисление на CH₄"], genes: "sMMO / pMMO", score: best(["Soluble methane monooxygenase", "ammonia oxidation (amo/pmmo)"]), bend: 0, lo: [-12, 34] },
      { from: "CH3OH", to: "HCHO", name: ["CH₃OH oxidation", "окисление на CH₃OH"], genes: "mxaFI", score: best(["methanol dehydrogenase", "alcohol oxidase"]), bend: 0, lo: [4, 34] },
      { from: "HCHO", to: "BIO", name: ["serine pathway", "серинов път"], genes: "", score: S("Serine pathway/formaldehyde assimilation"), bend: 0 },

    ]);

    [["#3f9a50", T.cy_l_full], ["var(--s4)", T.cy_l_mid], ["var(--s3)", T.cy_l_low]].forEach(function (x) {

  })();

  /* CAZy by substrate: solid = main activity, hatched = possible */
  (function () {

    var col = css("--p2");
    draw("ch-cazysub", [
      { type: "bar", orientation: "h", name: T.csub_main, y: y, x: rows.map(function (r) { return r.main; }).reverse(),
        customdata: rows.map(function (r) { return fams(r.main_families); }).reverse(),
        marker: { color: col, line: { color: "#ffffff", width: 1 } },
        hovertemplate: "<b>%{y}</b><br>" + esc(T.csub_main) + ": %{x} " + T.proteins + "<br>%{customdata}<extra></extra>" },
      { type: "bar", orientation: "h", name: T.csub_possible, y: y, x: rows.map(function (r) { return r.possible; }).reverse(),

      xaxis: { title: { text: T.proteins, font: { size: 11 } } } });
  })();

  /* CAZy */
  var cz = Object.keys(D.cazy.class);
  if (!cz.length) { $("cazy-wrap").innerHTML = "<h3>" + esc(T.cazy_title) + '</h3><p class="note">' + esc(T.cazy_none) + "</p>"; }
  else {
    cz.sort(function (a, b) { return D.cazy.class[b] - D.cazy.class[a]; });

  var pf = D.pfam.top;

  /* gene table */
  var rows = D.table, hay = rows.map(function (r) { return r.join(" ").toLowerCase(); });

  $("gene-cog").innerHTML = '<option value="">' + esc(T.table_all) + "</option>" + cog.map(function (c) {

  function cell(i, v) { // 0 ID, 1 gene, 2 description, 3 COG, 4 KO, 5 EC, 6 CAZy, 7 TC, 8 Pfam, 9 level

    return "<td>" + esc(v) + "</td>";
  }

    var start = page * perPage, slice = filtered.slice(start, start + perPage);
