name: publish to Tool Shed

# Manual: Actions -> "publish to Tool Shed" -> Run workflow -> choose the target.
# Needs repository secrets TESTTOOLSHED_API_KEY and/or TOOLSHED_API_KEY
# (Settings -> Secrets and variables -> Actions). The keys never appear in the code or logs.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Tool Shed"
        type: choice
        options: [toolshed, testtoolshed]
        default: toolshed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install planemo
      - name: Lint the tool
        run: planemo lint eggsplorer.xml
      - name: Create or update the repository
        env:
          KEY: ${{ inputs.target == 'toolshed' && secrets.TOOLSHED_API_KEY || secrets.TESTTOOLSHED_API_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::Missing API key secret for ${{ inputs.target }}"; exit 1; }
          set -o pipefail
          planemo shed_update --shed_target ${{ inputs.target }} --shed_key "$KEY" \
            --force_repository_creation --message "Eggsplorer $(git rev-parse --short HEAD)" . 2>&1 | tee shed.log \
            || { tail -n 25 shed.log | grep -v "$KEY" | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          tail -n 5 shed.log | while IFS= read -r line; do echo "::notice::$line"; done
